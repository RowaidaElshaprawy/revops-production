version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/revops.db
      - REVOPS_API_KEY=${REVOPS_API_KEY:-}
      - ENVIRONMENT=production
    volumes:
      - revops_data:/app/data

  dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////app/data/revops.db
      - ENVIRONMENT=production
    volumes:
      - revops_data:/app/data
    depends_on:
      - api

volumes:
  revops_data:
